databases:
  - name: outdoor-media-db
    databaseName: outdoor_media_inventory
    user: outdoor_media_user
    plan: free

services:
  - type: web
    name: outdoor-media-inventory-dashboard
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: outdoor-media-db
          property: connectionString
